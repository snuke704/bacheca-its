# ---------------------------------------------------------------------------
#  CI - i controlli che girano su OGNI pull request.
#
#  Questo file e' INCOMPLETO: dove trovi  # TODO n  devi scrivere tu.
#  Il primo gate (struttura) e' gia' completo: usalo come esempio.
#
#  Consiglio: completa un TODO alla volta, fai commit, guarda la tab Actions.
#  Un job rosso ti dice esattamente quale riga non va.
