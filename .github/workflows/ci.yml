name: CI

# TODO 1 - Fai partire questo workflow su OGNI pull request verso main,
#          e anche sui push diretti a main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # -------------------------------------------------- GATE 1: struttura (ESEMPIO GIA' FATTO)
  struttura:
    name: Gate struttura - i file ci sono ancora?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: I file indispensabili non sono stati cancellati
        run: |
          for f in data/avvisi.json src/build.mjs test/bacheca.test.mjs package.json; do
            if [ ! -f "$f" ]; then
              echo "manca $f: non si passa"
              exit 1
            fi
          done
          echo "struttura del progetto integra"

  # -------------------------------------------------- GATE 2: segreti
  segreti:
    name: Gate segreti - niente credenziali nel repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TODO 2 - Aggiungi lo step che esegue lo script script/sniffa-segreti.sh
      #          sulla cartella corrente. Lo script esce con 1 se trova un segreto:
      #          tanto basta perche' il job diventi rosso.

  # -------------------------------------------------- GATE 3: applicazione
  applicazione:
    name: Gate applicazione - dipendenze, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # TODO 3 - Tre step, in quest'ordine:
